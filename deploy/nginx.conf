# Nginx site for shimaazimi.ir. setup-server.sh installs it; certbot adds the HTTPS parts.

# Built files have content hashes in their names, so they can be cached forever; pages are always rechecked
map $uri $shimaazimi_cache {
    ~^/_next/static/  "public, max-age=31536000, immutable";
    default           "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name shimaazimi.ir www.shimaazimi.ir;

    root /var/www/shimaazimi.ir/current;
    index index.html;

    # One address for everyone: www goes to the bare domain
    if ($host = www.shimaazimi.ir) {
        return 301 $scheme://shimaazimi.ir$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $shimaazimi_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
